name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  # Run the whole suite (including the nightly-only e2e-full job) on demand
  # instead of waiting for the cron when a change needs the slow gates now.
  workflow_dispatch:

# Scope the group by event so the nightly full-suite run never shares a group
# with push runs on the same ref. Within an event, a new PR commit or a push to
# a feature branch supersedes the in-flight run; a push to the long-lived
# main/dev branches and the scheduled run finish instead, since nothing newer
# will verify those commits and cancelling would drop their only signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'dev') }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:password@localhost:5432/quackback_test
  BETTER_AUTH_SECRET: test-secret-for-ci-only-must-be-at-least-32-characters
  BASE_URL: http://localhost:3000

jobs:
  check:
    runs-on: ubuntu-latest
    # The build is the slow part; a hung install, build, or typecheck must not
    # silently consume the runner until the default multi-hour limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Audit production dependencies
        run: bun scripts/audit-check.ts
      - run: bun run lint
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      # A server function the client graph never references is left out of the
      # generated manifest, so calling it 500s at request time and only in a
      # production build. Compare the built bundle's call sites against the
      # manifest while we still have the output.
      - run: bun run --cwd apps/web check:server-fn-manifest
      - run: bun run --filter @quackback/web typecheck
      - run: bun run --cwd packages/db typecheck
      - run: bun run --cwd packages/email typecheck

  # Four shards on four-core runners. The ~1,300-file suite was ~8–9 min of
  # wall clock on one job; splitting files is what makes the unit gate finish
  # in a couple of minutes. The matrix is the single source of the shard count:
  # the job name and --shard both read strategy.job-total, so adding a shard
  # touches only the list below.
  unit:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Budget, not a target: a shard that doubles in wall clock fails here rather
    # than quietly slowing every PR. The suite is ~3-5 min per shard today.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # Renderer tests use jsdom with DOMPurify, which requires a current Node runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      # Drift only needs to run once; shard 1 owns it so the other three start
      # the suite immediately after migrate.
      - name: Check migration/schema drift
        if: matrix.shard == 1
        run: bun run db:check-drift
      - run: bun run test --run --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=dot --reporter=github-actions

  # Single check name so existing "test" required-status wiring still matches.
  test:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All unit shards passed
        run: test "${{ needs.unit.result }}" = "success"

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: e2e-smoke-secret-key-for-ci-only-at-least-32-chars
      BASE_URL: http://acme.localhost:3000
      # The curated PR gate: only specs known to pass in this job. `@smoke`
      # marks more specs than run here (the conversation-flow and conversation
      # image specs need richer setup and are not green in CI yet); add one here
      # once it is. The gate lists files instead of relying on the tag alone
      # because Playwright loads every discovered spec to evaluate --grep, and
      # one unrelated load-time error would fail the gate.
      SMOKE_SPECS: >-
        tests/admin/inbox.spec.ts
        tests/public/portal-support.spec.ts
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # Playwright silently ignores an argument that matches no file, so a
      # deleted or renamed spec narrows the gate while CI stays green (the
      # workflows spec was dropped in 9fea133f7 and this list kept naming it).
      # Fail loudly instead.
      - name: Check smoke specs exist
        run: |
          for spec in $SMOKE_SPECS; do
            test -f "apps/web/e2e/$spec" || {
              echo "::error::smoke spec $spec is missing; update SMOKE_SPECS in .github/workflows/ci.yml"
              exit 1
            }
          done
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      # The seed workspace is served on the acme.localhost subdomain; make sure
      # Node-side fetches (Playwright request API, webServer readiness probe)
      # resolve it regardless of the runner's resolver.
      - name: Map acme.localhost to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The dev server loads env from the repo-root .env (bun --env-file) and
      # the e2e db-helpers spawn scripts through `dotenv -e ../../.env`, so
      # materialize one for CI.
      - name: Write .env for the dev server and e2e scripts
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          EOF
      - run: bun run db:migrate
      - run: bun run db:seed
      # bunx re-resolves playwright from the registry and can hang for the
      # whole job timeout. Drive the workspace binary. Cache browsers so a
      # later run skips the CDN fetch; restore-keys reuses the newest browser
      # cache after a lockfile change and the install step only fills in the
      # revision the new Playwright version needs. System deps (--with-deps /
      # apt) are best-effort: a stalled apt mirror must not fail the job.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      # Start the app and run specs in one step. A separate step's shell
      # exit SIGHUPs `vite dev` on GHA (same lesson as live-api). Waiting
      # on /api/health/ready first avoids Playwright racing a Nitro 503.
      - name: Run @smoke e2e specs
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
        run: |
          bun --env-file=.env --cwd apps/web vite dev --host 0.0.0.0 --port 3000 \
            > /tmp/quackback-e2e.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$BASE_URL/api/health/ready" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo '===== server log (never became ready) ====='
            cat /tmp/quackback-e2e.log
            exit 1
          fi
          # SMOKE_SPECS is the explicit file list (not just the tag) so an
          # unrelated spec with a load-time error can't take the smoke gate
          # down; the setup project (admin auth) still runs as a project
          # dependency, unfiltered.
          if ! (cd apps/web && ./node_modules/.bin/playwright test $SMOKE_SPECS \
            --grep "@smoke"); then
            echo '===== server log (playwright failed) ====='
            cat /tmp/quackback-e2e.log
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-smoke-report
          path: apps/web/blob-report
          retention-days: 7

  # Deterministic performance counts (queries, requests, JS and HTML bytes) for
  # the journeys in apps/web/perf/journeys.ts, compared with the ceilings in
  # apps/web/perf/budgets.json. A count over its ceiling fails; a count under
  # it leaves a notice to ratchet the ceiling down.
  perf:
    runs-on: ubuntu-latest
    # The build, plus about 160 journeys (the breadth sweep loads every page).
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      - run: bun run --cwd apps/web perf:setup
      - run: bun run --cwd apps/web perf
      # Server-rendered pages hydrate cleanly for a visitor in another time
      # zone and locale (a date or number formatted differently on each side
      # is a hydration error).
      - run: bun run --cwd apps/web perf:hydration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: perf-results
          path: apps/web/perf/.results/latest.json
          retention-days: 14

  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: 'true'
      SECRET_KEY: live-api-secret-key-for-ci-only-at-least-32-characters
      BASE_URL: http://acme.localhost:3000
      API_BASE_URL: http://acme.localhost:3000/api/v1
      REQUIRE_LIVE_API: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Map workspace hostname to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run db:seed
      - name: Write runtime environment
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          EOF
      - name: Provision CI API key
        run: |
          api_key=$(bun apps/web/scripts/create-ci-api-key.ts)
          echo "::add-mask::$api_key"
          echo "API_KEY=$api_key" >> "$GITHUB_ENV"
      - name: Start application and run live API assertions
        run: |
          # Bind every interface. Vite's default localhost is sometimes
          # IPv6-only while Node fetch of *.localhost uses 127.0.0.1.
          bun --env-file=.env --cwd apps/web vite dev --host 0.0.0.0 --port 3000 \
            > /tmp/quackback-live-api.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$BASE_URL/api/health/ready" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo '===== server log (never became ready) ====='
            cat /tmp/quackback-live-api.log
            exit 1
          fi
          # Drive the workspace binary, as the @smoke job does with Playwright:
          # `bunx` re-resolves from the registry and can hang for the whole job
          # timeout when the registry is slow.
          if ! (cd apps/web && ../../node_modules/.bin/vitest run --config vitest.config.ts \
            src/lib/server/domains/api/__tests__/api-integration.test.ts); then
            echo '===== server log (vitest failed) ====='
            cat /tmp/quackback-live-api.log
            ss -lntp || true
            exit 1
          fi

  e2e-full:
    # The whole Playwright suite is too slow for every PR: run it nightly, or on
    # an explicit workflow_dispatch when a change needs it before the cron fires.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Eight shards, one worker each. Sharding is the parallelism this suite
    # tolerates — every shard gets its own Postgres service and its own server,
    # so specs keep the single-workspace assumptions they were written for,
    # whereas more workers per shard would have them mutating one workspace's
    # settings concurrently. The suite did not fit a single 60-minute job
    # (run 44897107294 was cancelled at 60:00 on 2026-11-21); four shards of the
    # 836-test suite still took 15–49 minutes per shard, eight leaves each shard
    # roughly eight spec files.
    name: e2e-full (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Budget, not a target: a shard that triples its wall clock fails here rather
    # than quietly holding a runner. A green shard is ~8-12 minutes today.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: e2e-full-secret-key-for-ci-only-at-least-32-chars
      BASE_URL: http://acme.localhost:3000
      # Playwright starts the app itself; this makes it start the built server
      # (below) instead of the Vite dev server. Dev transforms each route on its
      # first request, which on a two-core runner costs seconds per page and was
      # most of this suite's wall clock.
      E2E_SERVER: production
      # The suite drives every auth endpoint from one address in one process, so
      # Better-Auth's per-IP budget is spent by the suite's own sign-ins and its
      # 429s land on whichever spec runs next. The app's own sign-in limiters
      # (auth/signin-rate-limit.ts) stay on: they are what the auth specs assert.
      DISABLE_AUTH_RATE_LIMIT: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Map acme.localhost to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Write .env for the app server and e2e scripts
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          # Object storage is addressable but never contacted from CI. Rendering
          # an attachment URL needs `isS3Configured()` (bucket, region and keys)
          # to mint one at all, and the specs that attach images stub both the
          # browser's upload POST and the storage GET. There is no live bucket,
          # so no spec may depend on a real upload reaching object storage; the
          # values only have to be shaped like a configuration.
          S3_BUCKET=quackback-e2e
          S3_REGION=us-east-1
          S3_ACCESS_KEY_ID=e2e-access-key
          S3_SECRET_ACCESS_KEY=e2e-secret-key
          EOF
      - run: bun run db:migrate
      - run: bun run db:seed
      # One build per shard rather than an artifact hand-off: the build is
      # ~1.5 minutes and the eight run in parallel anyway, so a 300 MB
      # upload/download would be the slower path.
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      # Print results instead of collecting report artifacts: the list reporter
      # writes one line per test, each test's stdout/stderr as it runs, and the
      # full failure output (with retries) at the end — all in the job log, where
      # a failed nightly shard can be read without downloading anything.
      - run: ./node_modules/.bin/playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=list
        working-directory: apps/web
